<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090817">
<title>SafeHaven</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="boot-error" hidden></div>
<script>
window.onerror=(message,source,line,column,error)=>{
  const box=document.getElementById('boot-error'); if(!box)return false; box.hidden=false;
  box.textContent='SAFEHAVEN FAILED TO START\n\n'+(error?.stack||message||'Unknown error'); return false;
};
</script>
<div id="game-shell">
  <canvas id="game" width="960" height="540" aria-label="SafeHaven game canvas"></canvas>
  <div id="touch" aria-label="Touch controls">
    <div class="dpad">
      <button data-action="up">▲</button><button data-action="left">◀</button><button data-action="down">▼</button><button data-action="right">▶</button>
    </div>
    <div class="actions"><button data-action="menu">MENU</button><button data-action="cancel">B</button><button class="primary" data-action="confirm">A</button></div>
  </div>
</div>
<script src="src/data.js"></script>
<script src="src/save.js"></script>
<script src="src/battle.js"></script>
<script src="src/world.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
</body>
</html>
