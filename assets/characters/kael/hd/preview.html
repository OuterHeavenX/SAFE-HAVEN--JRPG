<!doctype html><meta charset="utf-8"><title>Kael HD Sprite Preview</title>
<style>body{margin:0;background:#0a0d1c;color:#f0d887;font:14px system-ui}header{position:sticky;top:0;background:#10152a;padding:12px;z-index:2}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;padding:12px}.card{background:#151b33;border:1px solid #7b6730;padding:10px}.stage{height:190px;display:grid;place-items:end center;background:repeating-conic-gradient(#25304a 0 25%,#1b243a 0 50%) 0/16px 16px}.stage img{image-rendering:pixelated;transform:scale(2);transform-origin:bottom center}</style>
<header><b>SAFEHAVEN · Kael HD production preview</b> — exact native cells, nearest-neighbor display</header><main id="grid"></main>
<script>fetch('manifest.json').then(r=>r.json()).then(m=>{for(const [name,a] of Object.entries(m.animations)){const c=document.createElement('section');c.className='card';c.innerHTML=`<b>${name}</b> · ${a.frames}f @ ${a.fps}fps<div class="stage"><img></div>`;grid.append(c);const img=c.querySelector('img'),base='../../../../../../';let i=0;setInterval(()=>{img.src=base+(a.framePattern.replace('%02d',String(i++%a.frames).padStart(2,'0')))},1000/a.fps)}})</script>
